<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>بيبغروف — فقّس · ربِّ · امزج · صادِق</title>
<link rel="manifest" href="manifest-ar.webmanifest">
<meta name="theme-color" content="#3E9E5C">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="بيبغروف">
<link rel="icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 512 512'><rect width='512' height='512' rx='112' fill='%233E9E5C'/><ellipse cx='256' cy='292' rx='118' ry='148' fill='%23FFF7E4'/><circle cx='218' cy='240' r='17' fill='%238BC48A'/><circle cx='298' cy='290' r='13' fill='%238BC48A'/><circle cx='238' cy='348' r='15' fill='%238BC48A'/><path d='M256 120c28-42 72-48 98-42-6 36-36 64-80 64z' fill='%2363C584'/></svg>">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+Bhaijaan+2:wght@500;600;700;800&family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* ============================================================
   بيبغروف — النسخة العربية (RTL) — نفس المحرك، واجهة أصلية
   ============================================================ */
:root{
  --cream:#FFF7E4; --cream2:#FFEFD0; --ink:#4A3222; --brown:#6B4A2F; --brownD:#4A3222;
  --leaf:#3E9E5C; --leafD:#2C7A44; --leafL:#63C584;
  --gold:#FFC53D; --goldD:#D99A1B; --pink:#FF7096; --pinkD:#D94F74;
  --sky:#4FC3E8; --skyD:#2E93B8; --lilac:#9B6BD6; --ember:#FF8A4A;
  --panelShadow:0 8px 0 rgba(74,50,34,.28);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:'Cairo','Segoe UI',sans-serif;color:var(--ink);
  background:#274d33;user-select:none;-webkit-user-select:none;overflow:hidden;
}
#gameCanvas{position:fixed;inset:0;width:100%;height:100%;display:block;image-rendering:auto;touch-action:none}
#joy{touch-action:none}
#modalRoot textarea,#modalRoot input{user-select:text;-webkit-user-select:text}
.panelBody{-webkit-overflow-scrolling:touch}

/* ---------- generic chunky UI ---------- */
.disp{font-family:'Baloo Bhaijaan 2','Cairo',sans-serif}
.btn{
  touch-action:manipulation;
  font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;letter-spacing:0;
  border:3px solid var(--brown);border-radius:14px;cursor:pointer;
  background:var(--leaf);color:#fff;padding:10px 18px;font-size:16px;
  box-shadow:0 5px 0 var(--leafD),0 8px 0 rgba(74,50,34,.25);
  transition:transform .08s,box-shadow .08s,filter .15s;
  display:inline-flex;align-items:center;gap:8px;justify-content:center;
}
.btn:hover{filter:brightness(1.06)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--leafD),0 3px 0 rgba(74,50,34,.25)}
.btn.gold{background:var(--gold);color:var(--brownD);box-shadow:0 5px 0 var(--goldD),0 8px 0 rgba(74,50,34,.25)}
.btn.gold:active{box-shadow:0 1px 0 var(--goldD),0 3px 0 rgba(74,50,34,.25)}
.btn.pinky{background:var(--pink);box-shadow:0 5px 0 var(--pinkD),0 8px 0 rgba(74,50,34,.25)}
.btn.pinky:active{box-shadow:0 1px 0 var(--pinkD),0 3px 0 rgba(74,50,34,.25)}
.btn.sky{background:var(--sky);box-shadow:0 5px 0 var(--skyD),0 8px 0 rgba(74,50,34,.25)}
.btn.sky:active{box-shadow:0 1px 0 var(--skyD),0 3px 0 rgba(74,50,34,.25)}
.btn.ghost{background:var(--cream);color:var(--ink);box-shadow:0 5px 0 #D8C69E,0 8px 0 rgba(74,50,34,.25)}
.btn.ghost:active{box-shadow:0 1px 0 #D8C69E}
.btn.danger{background:#D9534F;box-shadow:0 5px 0 #A93B38,0 8px 0 rgba(74,50,34,.25)}
.btn:disabled{filter:grayscale(.7) brightness(.85);cursor:not-allowed;transform:none}
.btn svg{width:18px;height:18px;flex:none}
.chip{
  display:inline-flex;align-items:center;gap:6px;background:var(--cream2);
  border:2px solid var(--brown);border-radius:999px;padding:3px 11px;
  font-weight:800;font-size:13px;color:var(--ink);line-height:1.5;
}
.chip .dot{width:11px;height:11px;border-radius:50%;border:2px solid rgba(0,0,0,.25);flex:none}
.bar{height:12px;border-radius:999px;background:rgba(74,50,34,.16);border:2px solid rgba(74,50,34,.35);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:999px;transition:width .35s ease}

/* ---------- HUD ---------- */
#hud{position:fixed;inset:0;pointer-events:none;z-index:20}
#hudTop{position:absolute;top:max(10px,env(safe-area-inset-top));left:10px;right:10px;display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
#hudChips{display:flex;gap:6px;flex-wrap:wrap;pointer-events:auto;max-width:70%}
#hudChips .chip{background:rgba(255,247,228,.92);box-shadow:0 3px 0 rgba(74,50,34,.25)}
#hudBtns{display:flex;gap:8px;pointer-events:auto}
.iconBtn{
  touch-action:manipulation;
  width:46px;height:46px;border-radius:14px;border:3px solid var(--brown);
  background:var(--cream);color:var(--ink);display:flex;align-items:center;justify-content:center;
  cursor:pointer;box-shadow:0 4px 0 rgba(74,50,34,.3);transition:transform .08s;position:relative;
}
.iconBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(74,50,34,.3)}
.iconBtn svg{width:22px;height:22px}
.ibadge{position:absolute;top:-7px;left:-7px;min-width:19px;height:19px;border-radius:999px;background:var(--pink);color:#fff;
  font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;border:2px solid var(--brownD);padding:0 3px}
.setDesc{font-size:11.5px;font-weight:700;color:#8A6F52;line-height:1.5;margin-top:2px;max-width:360px}
#objChip{
  position:absolute;top:calc(max(10px,env(safe-area-inset-top)) + 52px);left:50%;transform:translateX(-50%);
  pointer-events:auto;cursor:pointer;background:rgba(74,50,34,.88);color:#FFEFD0;border:2px solid var(--gold);
  border-radius:999px;padding:6px 16px;font-weight:800;font-size:13px;max-width:86vw;
  display:flex;gap:8px;align-items:center;box-shadow:0 4px 0 rgba(0,0,0,.3);
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s;
}
#objChip .pip{width:10px;height:10px;border-radius:50%;background:var(--gold);flex:none;animation:objPulse 1.4s infinite}
@keyframes objPulse{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(1.5);opacity:.55}}

/* ---------- dock ---------- */
#dock{
  position:fixed;bottom:max(10px,env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);
  display:flex;gap:7px;z-index:25;pointer-events:auto;max-width:98vw;overflow-x:auto;
  padding:8px 10px;background:rgba(74,50,34,.82);border:3px solid var(--brownD);border-radius:20px;
  box-shadow:0 8px 0 rgba(0,0,0,.28);scrollbar-width:none;
}
#dock::-webkit-scrollbar{display:none}
.dockBtn{
  touch-action:manipulation;
  flex:none;width:68px;padding:7px 4px 6px;border-radius:14px;border:none;cursor:pointer;
  background:var(--cream);color:var(--ink);display:flex;flex-direction:column;align-items:center;gap:3px;
  font-family:'Baloo Bhaijaan 2',sans-serif;font-size:12px;font-weight:700;box-shadow:0 4px 0 rgba(0,0,0,.3);
  transition:transform .08s,background .15s;position:relative;
}
.dockBtn svg{width:22px;height:22px}
.dockBtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.3)}
.dockBtn:hover{background:#fff}
.dockBtn .badge{
  position:absolute;top:-6px;left:-4px;min-width:20px;height:20px;border-radius:999px;
  background:var(--pink);color:#fff;font-size:11px;font-weight:800;display:flex;align-items:center;
  justify-content:center;border:2px solid var(--brownD);padding:0 4px;
}

/* ---------- joystick + interact (mirrored for RTL) ---------- */
#joy{position:fixed;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 92px);left:22px;width:128px;height:128px;z-index:24;display:none}
#joyBase{position:absolute;inset:0;border-radius:50%;background:rgba(255,247,228,.22);border:3px solid rgba(255,247,228,.5)}
#joyKnob{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px;border-radius:50%;
  background:var(--cream);border:3px solid var(--brown);box-shadow:0 4px 0 rgba(0,0,0,.3);transition:none}
#actBtn{
  position:fixed;bottom:calc(max(10px,env(safe-area-inset-bottom)) + 106px);right:22px;z-index:24;
  min-width:96px;height:72px;padding:8px 18px;border-radius:22px;border:3px solid var(--brown);
  background:var(--gold);color:var(--brownD);font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:16px;
  box-shadow:0 6px 0 var(--goldD),0 9px 0 rgba(0,0,0,.3);cursor:pointer;display:none;
  align-items:center;justify-content:center;text-align:center;line-height:1.2;
}
#actBtn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--goldD)}
body.touch #actBtn{display:flex;animation:actPulse 1.7s ease-in-out infinite}
#actBtn.hide{display:none!important}
@keyframes actPulse{
 0%,100%{box-shadow:0 6px 0 var(--goldD),0 9px 0 rgba(0,0,0,.3),0 0 0 0 rgba(255,197,61,.5)}
 55%{box-shadow:0 6px 0 var(--goldD),0 9px 0 rgba(0,0,0,.3),0 0 0 14px rgba(255,197,61,0)}
}

/* ---------- toasts & banner ---------- */
#toasts{position:fixed;top:calc(max(10px,env(safe-area-inset-top)) + 88px);left:50%;transform:translateX(-50%);
  z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:min(92vw,480px)}
.toast{
  background:rgba(74,50,34,.92);color:#FFEFD0;border:2px solid var(--gold);border-radius:14px;
  padding:11px 18px;font-weight:800;font-size:15px;box-shadow:0 5px 0 rgba(0,0,0,.3);
  animation:toastIn .3s cubic-bezier(.2,1.4,.4,1);text-align:center;max-width:100%;line-height:1.8;
}
.toast.good{border-color:#7BE0A0;background:rgba(44,122,68,.94)}
.toast.warn{border-color:#FFB0A0;background:rgba(169,59,56,.94)}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{transform:translateY(-18px) scale(.8);opacity:0}}
@keyframes toastOut{to{transform:translateY(-14px);opacity:0}}
#banner{
  position:fixed;top:-150px;left:50%;transform:translateX(-50%);z-index:70;width:min(94vw,440px);
  background:var(--cream);border:4px solid var(--brown);border-radius:20px;box-shadow:var(--panelShadow);
  display:flex;gap:14px;align-items:center;padding:12px 16px;transition:top .5s cubic-bezier(.2,1.3,.4,1);
}
#banner.show{top:max(60px,calc(env(safe-area-inset-top) + 56px))}
#banner canvas{width:74px;height:74px;flex:none}
#banner .bt{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:13px;color:var(--leafD);font-weight:700}
#banner .bn{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:23px;font-weight:800;line-height:1.2}
#banner .bd{font-size:12.5px;font-weight:600;color:#7A6248;margin-top:2px;line-height:1.6}

/* ---------- modal system ---------- */
#modalRoot{position:fixed;inset:0;z-index:90;display:none}
#devBg{position:fixed;inset:0;background:rgba(20,26,20,.7);z-index:120;display:none}
#devBg.open{display:block}
#devPanel{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);z-index:121;width:min(94vw,560px);max-height:88vh;display:none;flex-direction:column}
#devPanel.open{display:flex}
#devPanel input{font-family:monospace;letter-spacing:1px;text-transform:uppercase}
#modalRoot.open{display:block}
#modalBackdrop{position:absolute;inset:0;background:rgba(39,52,35,.55);animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.panel{
  position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
  width:min(94vw,640px);max-height:min(88vh,760px);display:flex;flex-direction:column;
  background:var(--cream);border:4px solid var(--brown);border-radius:22px;box-shadow:var(--panelShadow);
  animation:panelPop .3s cubic-bezier(.2,1.35,.4,1);overflow:hidden;
}
@keyframes panelPop{from{transform:translate(-50%,-44%) scale(.9);opacity:0}}
.panelHead{
  flex:none;display:flex;align-items:center;gap:12px;padding:14px 18px;
  background:var(--cream2);border-bottom:3px solid var(--brown);
}
.panelHead h2{font-family:'Baloo Bhaijaan 2',sans-serif;font-size:23px;font-weight:800;flex:1;line-height:1.2}
.panelHead .sub{font-size:12px;font-weight:800;color:#8A6F52;display:block}
.xBtn{width:40px;height:40px;flex:none;border-radius:12px;border:3px solid var(--brown);background:var(--pink);color:#fff;
  font-family:'Baloo Bhaijaan 2',sans-serif;font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 4px 0 var(--pinkD);line-height:1}
.xBtn:active{transform:translateY(3px);box-shadow:none}
.panelBody{flex:1;overflow-y:auto;padding:16px 18px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.panelBody::-webkit-scrollbar{width:10px}
.panelBody::-webkit-scrollbar-thumb{background:#D8C69E;border-radius:99px;border:2px solid var(--cream)}
.panelFoot{flex:none;padding:12px 18px;border-top:3px solid rgba(107,74,47,.3);background:var(--cream2);display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.tab{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:14px;padding:7px 15px;border-radius:999px;
  border:2.5px solid var(--brown);background:var(--cream);color:var(--ink);cursor:pointer;transition:background .15s}
.tab.on{background:var(--leaf);color:#fff;box-shadow:0 3px 0 var(--leafD)}

.grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(122px,1fr));gap:10px}

.card{
  background:#fff;border:3px solid var(--brown);border-radius:16px;padding:10px;
  box-shadow:0 4px 0 rgba(107,74,47,.22);cursor:pointer;transition:transform .12s,box-shadow .12s;
  display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;position:relative;
}
.card:hover{transform:translateY(-3px) rotate(.4deg);box-shadow:0 7px 0 rgba(107,74,47,.25)}
.card.sel{outline:3px solid var(--gold);background:#FFFBEA}
.card canvas{width:86px;height:86px}
.card .nm{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:15px;line-height:1.3}
.card .sub{font-size:11px;font-weight:800;color:#8A6F52;line-height:1.5}
.card .chips{display:flex;gap:4px;flex-wrap:wrap;justify-content:center}
.card .mini{font-size:10.5px;padding:1px 8px;border-width:2px}
.card .heartRow{display:flex;gap:3px;justify-content:center}
.heart{width:12px;height:12px;background:#E3D9C4;border-radius:50% 50% 50% 0;transform:rotate(-45deg);border:1.5px solid rgba(74,50,34,.3)}
.heart.f{background:var(--pink)}

.rchip{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:800;padding:2px 9px;border-radius:999px;border:2px solid rgba(0,0,0,.2);color:#fff}
.listRow{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--brown);border-radius:16px;
  padding:10px 14px;margin-bottom:10px;box-shadow:0 4px 0 rgba(107,74,47,.2)}
.listRow .grow{flex:1;min-width:0}
.listRow .nm{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;font-size:16px}
.listRow .ds{font-size:12.5px;font-weight:600;color:#7A6248;line-height:1.6}
.statBarRow{display:flex;align-items:center;gap:8px;margin:5px 0}
.statBarRow .lbl{width:64px;font-weight:800;font-size:12px;color:#7A6248;flex:none}
.statBarRow .val{width:26px;text-align:left;font-weight:800;font-size:12px;flex:none}

.reqCard{background:#fff;border:3px solid var(--brown);border-radius:18px;padding:14px;margin-bottom:12px;box-shadow:0 5px 0 rgba(107,74,47,.22);position:relative;overflow:hidden}
.reqCard .trow{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.avatar{width:46px;height:46px;flex:none;border-radius:50%;border:3px solid var(--brown);display:flex;align-items:center;justify-content:center;
  font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;color:#fff;font-size:18px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.15)}
.reqCard .flavor{font-size:13px;font-weight:600;color:#6b5540;margin:6px 0 8px;line-height:1.7}
.reqCard .rw{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.timerBar{position:absolute;right:0;bottom:0;height:5px;background:var(--gold);transition:width 1s linear}

.mRow{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--brown);border-radius:14px;padding:10px 14px;margin-bottom:9px;box-shadow:0 3px 0 rgba(107,74,47,.18)}
.mRow.done{opacity:.6;background:#EFF7E9}
.mCheck{width:30px;height:30px;flex:none;border-radius:50%;border:3px solid var(--brown);background:var(--cream2);display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--leafD)}
.mRow.done .mCheck{background:var(--leaf);color:#fff}

.upRow{display:flex;gap:12px;align-items:center;background:#fff;border:3px solid var(--brown);border-radius:16px;padding:12px 14px;margin-bottom:10px;box-shadow:0 4px 0 rgba(107,74,47,.2)}
.upRow .lvlPips{display:flex;gap:4px;margin-top:5px}
.pipDot{width:12px;height:12px;border-radius:50%;border:2px solid var(--brown);background:var(--cream2)}
.pipDot.on{background:var(--leaf)}

.slotBox{border:3px dashed rgba(107,74,47,.5);border-radius:16px;background:#FFFDF4;min-height:118px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;cursor:pointer;padding:8px;transition:background .15s}
.slotBox:hover{background:#FFF6D6}
.slotBox.full{border-style:solid;border-color:var(--brown);background:#fff}
.slotBox canvas{width:72px;height:72px}

.kv{display:flex;justify-content:space-between;gap:10px;font-weight:700;font-size:14px;padding:5px 0;border-bottom:2px dashed rgba(107,74,47,.25)}
.hint{font-size:12.5px;font-weight:700;color:#8A6F52;background:var(--cream2);border:2px dashed rgba(107,74,47,.45);border-radius:12px;padding:8px 12px;margin-top:10px;line-height:1.8}
button[data-simon]{position:relative}
button[data-simon].lit{filter:brightness(1.9) saturate(1.4);transform:scale(1.07);box-shadow:0 0 26px rgba(255,255,255,.5),0 4px 0 rgba(0,0,0,.3)}
textarea.codeBox{width:100%;height:90px;border:3px solid var(--brown);border-radius:12px;background:#fff;font-family:monospace;font-size:11px;padding:8px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--leaf)}
.switchRow{display:flex;justify-content:space-between;align-items:center;padding:9px 0;font-weight:800;gap:12px}
.switch{width:56px;height:30px;border-radius:99px;border:3px solid var(--brown);background:#E3D9C4;position:relative;cursor:pointer;transition:background .2s;flex:none}
.switch i{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--brown);transition:right .2s}
.switch.on{background:var(--leaf)}
.switch.on i{right:28px}

/* ---------- title screen ---------- */
#title{position:fixed;inset:0;z-index:80;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;
  background:linear-gradient(180deg,rgba(30,60,45,.15) 0%,rgba(24,42,32,.62) 100%);text-align:center;padding:20px}
#title.hide{display:none}
#logo{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:800;font-size:clamp(56px,13vw,104px);color:#FFF7E4;line-height:1;
  text-shadow:0 4px 0 #2C7A44,0 9px 0 rgba(0,0,0,.28)}
#logo span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
#logo span:nth-child(2){animation-delay:.3s;color:#FFD977}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-9px) rotate(1.5deg)}}
#tagline{font-family:'Baloo Bhaijaan 2',sans-serif;font-weight:700;color:#FFEFD0;font-size:clamp(15px,3vw,20px);
  text-shadow:0 2px 0 rgba(0,0,0,.4);display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center}
#tagline b{color:#FFC53D}
#titleBtns{display:flex;flex-direction:column;gap:12px;margin-top:14px;width:min(78vw,300px)}
#titleBtns .btn{font-size:19px;padding:13px 20px}
#titleFoot{position:absolute;bottom:max(14px,env(safe-area-inset-bottom));font-size:12px;font-weight:700;color:rgba(255,240,214,.75)}

 setVol(v){this.vol=v; if(this.master)this.master.gain.value=this.muted?0:v;},

function updateWildPips(dt){

  for(const area in want){ if(!G.areas[area]||area==='meadow'&&!G.started)continue;
    const have=G.wildPips.filter(w=>w.area===area).length;
    if(have<want[area]&&chance(.02)){
      const pt=pick(World.spawnPts[area]||World.spawnPts.meadow);
      G.wildPips.push({sp:weightedPick(EGG_TABLE[area]),x:pt[0]*TILE,y:pt[1]*TILE,tx:pt[0]*TILE,ty:pt[1]*TILE,area,t:rand(0,9),wt:0,flip:false,flee:0});
    } }
  const P=G.player;
  G.wildPips.forEach(w=>{ w.t+=dt; w.wt-=dt; if(w.flee>0)w.flee-=dt;
    const d2=dist2(w.x,w.y,P.x,P.y);
    if(G.started&&d2<30*30){ const a=Math.atan2(w.y-P.y,w.x-P.x);
      w.x=clamp(w.x+Math.cos(a)*110*dt,TILE*2,(MAP_W-2)*TILE); w.y=clamp(w.y+Math.sin(a)*110*dt,TILE*2,(MAP_H-2)*TILE); w.flip=Math.cos(a)<0; }
    else { if(w.wt<=0){w.wt=rand(2,5);w.tx=clamp(w.x+rand(-80,80),2*TILE,(MAP_W-2)*TILE);w.ty=clamp(w.y+rand(-80,80),2*TILE,(MAP_H-2)*TILE);}
      const a=Math.atan2(w.ty-w.y,w.tx-w.x);
      if(dist2(w.x,w.y,w.tx,w.ty)>100){ const sp2=w.flee>0?120:26;
        w.x=clamp(w.x+Math.cos(a)*sp2*dt,TILE*2,(MAP_W-2)*TILE); w.y=clamp(w.y+Math.sin(a)*sp2*dt,TILE*2,(MAP_H-2)*TILE); w.flip=Math.cos(a)<0; } }
  });

  });

function fusionResult(a,b,commit){
  if(SP[a.sp].el==='prism'||SP[b.sp].el==='prism')return {sp:'wishkin',special:'أمنية تتلألأ في الماء...'};
  if(a.stage>=4&&b.stage>=4)return {sp:'prismaw',special:'نور متلألئ يُنسج معًا!'};
  const key=[SP[a.sp].el,SP[b.sp].el].sort().join('+');
  if(RECIPES[key]){ if(commit&&!G.recipes.includes(key))G.recipes.push(key); return {sp:RECIPES[key]}; }
  if(commit&&!G.recipes.includes('wild'))G.recipes.push('wild');
  return {sp:chance(.5)?a.sp:b.sp,inherit:true};
}
function doFusion(){
  if(G.upgrades.spring<1){toast('ينبوع المزج راقد. فعّله من بسطة برامبل!','warn');return;}
  if(G.fusionCd>0){toast('الينبوع ما زال يشحن...','warn');return;}
  if(G.shards<1){toast('تحتاج شظية بلور. انقب العروق المتوهجة في الصخور أو الوادي.','warn');return;}
  const a=G.creatures.find(c=>c.uid===G.fuseA), b=G.creatures.find(c=>c.uid===G.fuseB);
  if(!a||!b||a.uid===b.uid){toast('اختر بيبين بالغين مختلفين.','warn');return;}
  G.shards--; G.fusionCd=G.upgrades.spring>=2?28:45;
  const res=fusionResult(a,b,true); const chroma=chance(Helpers.mutChance());
  G.eggs.push({sp:res.sp,type:res.sp==='prismaw'||res.sp==='wishkin'?'prisma':(SP[res.sp].rar>=2?'fine':'common'),fromFusion:true,chroma});
  G.stats.fusions++; AudioSys.fuse();
  logEvent('مزج '+SP[a.sp].n+' + '+SP[b.sp].n+' عند الينبوع — ظهرت بيضة جديدة'+(chroma?' (إنها تلمع... قزحي!)':''));
  particles(36*TILE,20*TILE,'spark',30,'#9FDCEF'); particles(36*TILE,20*TILE,'heart',10,'#FF9EC4');
  toast(res.special||'يتوهج الينبوع... تظهر بيضة جديدة في سلتك!',res.special?'good':'',4200);
  if(chroma)setTimeout(()=>toast('شيء يتلألأ داخل البيضة... تحوّل قزحي!','good',4200),900);

function genReq(){
  const tier=clamp(Math.floor(G.rep/60),0,6);
  if(G.kitchen.built&&chance(.32)){ const m=pick(Object.keys(MEAL_PRICES));
    return { id:Date.now()+randi(0,999), trainer:pick(TRAINERS), conds:{meal:m},
      coins:Math.round(MEAL_PRICES[m]*1.6), rep:12+tier*3, patience:150, age:0, flavor:pick(REQ_FLAVOR_MEAL) }; }
  const conds={minStage:clamp(2+Math.floor(tier/2),2,4)};
  const els=Object.keys(EL).filter(e=>e!=='prism');
  const pool=['el','pers','rar','stat'];
  const nConds=1+Math.min(3,Math.floor(tier*0.7)+(chance(.4)?1:0));
  const used=[];
  for(let i=0;i<nConds;i++){ const k=pick(pool.filter(p=>!used.includes(p))); used.push(k);
    if(k==='el')conds.el=pick(els);
    else if(k==='pers')conds.pers=pick(PERS).id;
    else if(k==='rar')conds.rar=clamp(1+Math.floor(tier/2),1,3);
    else if(k==='stat')conds.stat={key:pick(['v','z','c']),min:4+Math.min(4,tier)}; }
  if(tier>=5&&chance(.3))conds.chroma=true;
  const nC=used.length;
  const coins=25+22*nC+tier*12+(conds.rar?conds.rar*14:0)+(conds.chroma?80:0);
  const rep=10+5*nC+tier*3;
  return { id:Date.now()+randi(0,999), trainer:pick(TRAINERS), conds, coins, rep,
    patience:180, age:0, flavor:pick(REQ_FLAVOR) };
}
function reqText(r){ const c=r.conds, bits=[];
  if(c.meal)return 'طبقًا طازجًا: '+MEAL(c.meal).n+' من مطبخ ويلا';
  if(c.el)bits.push(EL[c.el].n); if(c.pers)bits.push(PERS.find(p=>p.id===c.pers).n);
  if(c.rar)bits.push(RARS[c.rar].n+'+'); if(c.chroma)bits.push('قزحي');
  let s=bits.length?'بيب '+bits.join('، '):'أي بيب';
  if(c.stat){const nm={v:'قوة',z:'سرعة',c:'جاذبية'}[c.stat.key]; s+=' بـ'+nm+' '+c.stat.min+'+';}
  return s+'، '+STAGE_NAMES[c.minStage]+' فأعلى';
}
function reqMatch(p,r){ const c=r.conds; if(!c)return false;
  if(c.meal)return false;
  if(p.trip)return false;
  if(p.stage<c.minStage)return false;
  if(c.el&&SP[p.sp].el!==c.el)return false;
  if(c.pers&&p.pers!==c.pers)return false;
  if(c.rar&&SP[p.sp].rar<c.rar)return false;
  if(c.stat&&p[c.stat.key]<c.stat.min)return false;
  if(c.chroma&&!p.chroma)return false; return true;
}

    particles(G.player.x,G.player.y-10,'spark',18,MEAL_BG[m]);
    toast(r.trainer.n+' يتلذذ بـ'+MEAL(m).n+'! +'+r.coins+' عملة · +'+r.rep+' سمعة','good',4600);
    UI.hud(); UI.open('req'); checkMissions(); return; }
  const pi=G.creatures.findIndex(c=>c.uid===pipUid); if(pi<0)return;

  AudioSys.coins(); setTimeout(()=>AudioSys.quest(),200);

  particles(G.player.x,G.player.y-10,'spark',18,'#FFC53D');
  toast('+'+coins+' عملة · +'+rep+' سمعة','good');
  UI.hud(); UI.open('req'); checkMissions();
}

document.addEventListener('click',e=>{
  const t=e.target.closest('[data-act]'); if(!t)return; const act=t.dataset.act;
  if(act!=='close')AudioSys.ensure();
  try{
  switch(act){
   case 'open': UI.open(t.dataset.panel); break;
   case 'close': UI.close(); AudioSys.tick(); break;
   case 'continue': startGame(false); break;
   case 'newgame': if(G.started||SaveSys.has()){ if(!confirm('تبدأ بستانًا جديدًا؟ سيُستبدل حفظك الحالي.'))return; }
     SaveSys.wipe(); freshState(); startGame(true); break;
   case 'rtab': UI.ranchTab=t.dataset.t; UI.open('ranch'); break;
   case 'shoptab': UI.shopTab=t.dataset.t; UI.open('shop'); break;
   case 'detail': { const p=G.creatures.find(c=>c.uid==t.dataset.uid); if(p)UI.detail(p); break; }
   case 'dexcard': UI.dexDetail(t.dataset.sp); break;
   case 'feedpick': UI.open('feed',+t.dataset.uid); break;
   case 'feed': { const p=G.creatures.find(c=>c.uid==t.dataset.uid); if(p){ feedPip(p,t.dataset.food); UI.open('feed',p.uid); } break; }
   case 'pet': { const p=G.creatures.find(c=>c.uid==t.dataset.uid); if(p)petPip(p); break; }
   case 'swap': { const p=G.creatures.find(c=>c.uid==t.dataset.uid); if(p){
       if(p.trip){toast(SP[p.sp].n+' مسافر مع رحّالة حاليًا.','warn');return;}
       if(p.barn){ if(Helpers.penPips().length>=Helpers.penCap()){toast('الزريبة ممتلئة! رقِّ الأعشاش الدافئة أو انقل أحدهم للحظيرة.','warn');return;} p.barn=false; const pr=World.penRect; p.x=rand(pr.x+24,pr.x+pr.w-24); p.y=rand(pr.y+20,pr.y+pr.h-16); toast('هرول '+SP[p.sp].n+' إلى الزريبة.','good'); }
       else { p.barn=true; toast(SP[p.sp].n+' يستريح في الحظيرة.',''); }
       AudioSys.pop(); UI.detail(p); UI.hud(); } break; }
   case 'placeegg': { const i=+t.dataset.i; if(!G.eggs.length){toast('لا بيض في سلتك. جده في البرية!','warn');return;}
     placeEggInInc(i); break; }
   case 'eggtoinc': { const i=+t.dataset.i; const slot=G.inc.findIndex(s=>!s);
     if(slot<0){toast('كل مصابيح الحاضنة مشغولة.','warn');return;}
     const e=G.eggs.splice(i,1)[0]; if(e){ G.inc[slot]={sp:e.sp,type:e.type,chroma:!!e.chroma,progress:0,dur:EGG_TYPES[e.type].dur/Helpers.hatchSpeed()}; AudioSys.pop(); }
     UI.open('bag'); setTimeout(()=>UI.open('inc'),50); break; }
   case 'fusesel': { const slot=t.dataset.slot; const eligible=G.creatures.filter(c=>c.stage>=3&&!c.trip&&c.uid!==G.fuseA&&c.uid!==G.fuseB);
     if(!eligible.length){toast('تحتاج بيبين بالغين (أو متلألئين). واصل الإطعام لينموا!','warn');return;}
     const node=UI.pickList('اختر الأب '+slot,eligible,'fuseset'); UI.close(); UI.current='fusepick'; UI.modalOpen=true; $('modalRoot').classList.add('open'); $('modalRoot').appendChild(node);
     UI.fuseSel=slot; break; }
   case 'fuseset': { const uid=+t.dataset.uid; if(UI.fuseSel==='أ')G.fuseA=uid; else G.fuseB=uid; UI.open('fuse'); break; }
   case 'fuse': doFusion(); break;
   case 'reqpick': { const r=G.reqs.find(x=>x.id==t.dataset.rid); if(!r)return;
     const eligible=G.creatures.filter(p=>reqMatch(p,r));
     UI.reqSel={rid:r.id,mode:t.dataset.mode};
     const node=UI.pickList('اختر بيبًا '+(t.dataset.mode==='loan'?'للإعارة':'للتبني'),eligible,'reqset','لا بيب يطابق هذا الطلب بعد. تفقد الشروط — العنصر، الشخصية، المرحلة، الندرة...');
     UI.close(); UI.current='reqpick'; UI.modalOpen=true; $('modalRoot').classList.add('open'); $('modalRoot').appendChild(node); break; }
   case 'reqset': { if(UI.reqSel)deliverReq(UI.reqSel.rid,+t.dataset.uid,UI.reqSel.mode); UI.reqSel=null; break; }
   case 'reqmeal': deliverReq(+t.dataset.rid,null,'meal'); break;
   case 'sellmeal': { const m=t.dataset.m; if((G.meals[m]||0)<1)return;
     G.meals[m]--; if(G.meals[m]<=0)delete G.meals[m];
     const price=MEAL_PRICES[m]; G.coins+=price; G.market.sold++;
     AudioSys.coins(); logEvent('باع '+MEAL(m).n+' في السوق بـ '+price+' ع.');
     toast('بيبكين يبيع '+MEAL(m).n+' بـ '+price+' عملة!','good');
     UI.hud(); UI.open('market'); checkStory(); break; }
   case 'taste': tasteMeal(t.dataset.r); break;
   case 'buyegg': { const cost={common:60,fine:150,prisma:900}[t.dataset.t]; if(G.coins<cost){AudioSys.deny();return;}
     G.coins-=cost;
     let sp; const tt=t.dataset.t;
     if(tt==='common')sp=pick(['mossnip','embrix','puddlefin','pebblit']);
     else if(tt==='fine')sp=weightedPick([['zibbit',.4],['frostle',.4],['murkling',.2]]);
     else sp=chance(.7)?'prismaw':'wishkin';
     G.eggs.push({sp,type:tt}); AudioSys.eggPick(); logEvent('اشترى '+EGG_TYPES[tt].n+' من بسطة برامبل.');
     toast('اشتريت '+EGG_TYPES[tt].n+'! صارت في سلتك.','good');
     UI.hud(); UI.open('shop'); break; }
   case 'buyfood': { const cost=t.dataset.f==='pellet'?8:14; if(G.coins<cost){AudioSys.deny();return;}
     G.coins-=cost; Helpers.addItem(t.dataset.f,1); AudioSys.pop(); UI.open('shop'); break; }
   case 'buyrod': { if(G.gear.rod)return;
     if(G.coins<100||(G.inv.boltnut||0)<10||(G.inv.sunberry||0)<8){AudioSys.deny();return;}
     G.coins-=100; Helpers.takeItem('boltnut',10); Helpers.takeItem('sunberry',8);
     G.gear.rod=true; AudioSys.unlock(); logEvent('صنع صنارة الصيد — البركة تنتظر!');
     toast('صُنعت صنارة الصيد! ألقِها من البقاع المتلألئة على ضفة البركة.','good',4600);
     UI.hud(); UI.open('shop'); checkMissions(); break; }
   case 'buytool': { const tk=t.dataset.t, T=TOOLS[tk]; if(!T||G.tools[tk])return;
     if(G.coins<T.cost||!Object.keys(T.mat).every(m=>(G.inv[m]||0)>=T.mat[m])){AudioSys.deny();return;}
     G.coins-=T.cost; Object.keys(T.mat).forEach(m=>Helpers.takeItem(m,T.mat[m]));
     G.tools[tk]=true; AudioSys.unlock(); logEvent('صنع '+T.n+'.');
     toast('صُنع '+T.n+'! '+T.d,'good',4600);
     UI.hud(); UI.open('shop'); checkMissions(); break; }
   case 'fetchmats': {
     const pairs=String(t.dataset.need||'').split(',').filter(Boolean).map(p=>p.split(':'));
     let cost=0; pairs.forEach(([m,n])=>{ cost+=(+n)*14; });
     if(!pairs.length||G.coins<cost){AudioSys.deny();return;}
     G.coins-=cost; pairs.forEach(([m,n])=>Helpers.addItem(m,+n));
     AudioSys.pop(); logEvent('جلب المواد الناقصة من مخزن البسطة (−'+cost+' عملة).');
     toast('مشوار المخزن: وصل الناقص إلى سلتك. (−'+cost+' عملة)','good');
     UI.hud(); UI.open('shop'); break; }
   case 'buytrap': { if(G.coins<45){AudioSys.deny();return;}
     G.coins-=45; G.trapCount++; AudioSys.pop(); logEvent('اشترى فخًّا من البسطة.');
     UI.hud(); UI.open('shop'); break; }
   case 'crafttrap': { if((G.inv.sunberry||0)<4){AudioSys.deny();return;}
     Helpers.takeItem('sunberry',4); G.trapCount++; AudioSys.pop();
     logEvent('نسج فخًّا من توت الشمس.'); UI.hud(); UI.open('shop'); break; }
   case 'buildboat': buildBoat(); break;
   case 'buyring': { if(G.ring||G.coins<600){AudioSys.deny();return;}
     G.coins-=600; G.ring=true; AudioSys.sparkle();
     logEvent('اشترى خاتم الألماس لروزا.');
     toast('خاتم الألماس يتلألأ في جيبك. ستقول روزا نعم الآن.','good',5600);
     UI.hud(); UI.open('shop'); checkStory(); break; }
   case 'buyveh': { const vk=t.dataset.v,V=VEHICLES[vk]; G.veh=G.veh||{};
     if(!V||G.veh[vk]||G.coins<V.cost){AudioSys.deny();return;}
     G.coins-=V.cost; G.veh[vk]=true; G.vehicle=vk; G.mounted=true; AudioSys.vroom();
     logEvent('اشترى '+V.n+'!'); toast(V.n+' لك — اركب وانطلق!','good',4600);
     UI.hud(); UI.open('shop'); break; }
   case 'ride': { const vk=t.dataset.v; G.veh=G.veh||{}; if(!G.veh[vk])return;
     if(G.mounted&&G.vehicle===vk){ G.mounted=false; toast('ركنت '+VEHICLES[vk].n+' ومددت ساقيك.',''); }
     else { G.vehicle=vk; G.mounted=true; AudioSys.vroom(); toast('خرخرة! تركب '+VEHICLES[vk].n+'.','good'); }
     UI.hud(); UI.open('shop'); break; }
   case 'buildswing': buildSwing(); break;
   case 'pushswing': pushSwing(); break;
   case 'golemfeed': golemFeed(t.dataset.f); break;
   case 'simon': simonPress(+t.dataset.i); break;
   case 'bait': { const f=t.dataset.food; if(!f||(G.inv[f]||0)<=0)return;
     if(t.dataset.mode==='deep'){ startFishing([DEEP.x,DEEP.y],f,true); UI.close(); }
     else if(t.dataset.mode==='fish'){ const s=World.fishSpots[+t.dataset.spot]; if(s)startFishing(s,f); UI.close(); }
     else if(t.dataset.mode==='plant'){ plantPlot(+t.dataset.plot,f); }

     UI.open('bait',{mode:'plant',plot:i}); break; }

   case 'mbuy': { const it=t.dataset.it; const cost=it==='fineegg'?130:it==='crystal'?45:750;
     if(it==='prisma'&&Helpers.marketLvl()<3)return;

     G.coins-=cost; AudioSys.eggPick();

    if(G.tutorial===1&&G.stats.hatched>=1){G.tutorial=2; setTimeout(()=>toast('افتح «البيبات» بالأسفل، اضغط بيبك الجديد وأطعمه وجبته المفضلة.','good',5600),1400);}

        '<button class="btn ghost" data-act="devcmd" data-c="areas">كل الأراضي</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="dex">موسوعة كاملة</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="quest">إنهاء مهمة</button>'+
        '<button class="btn ghost" data-act="devcmd" data-c="chapter">إنهاء فصل</button></div>'+
      '<div style="margin-top:16px"><button class="btn danger" data-act="devrestore">استعادة الحفظ العادي</button></div>'+
      '<div class="hint">يتوقف الحفظ التلقائي أثناء حالة الاختبار؛ الحفظ على القرص لا يُمس. الاستعادة ترجع البستان كما كان عند بدء الاختبار.</div>'+
      '</div>';
     document.body.appendChild(bg); document.body.appendChild(p);
     document.getElementById('devCode').addEventListener('keydown',e=>{ if(e.key==='Enter'){ e.preventDefault(); DevSys.enterCode(e.target.value); } e.stopPropagation(); });
   }
   document.getElementById('devBg').classList.add('open');
   document.getElementById('devPanel').classList.add('open');
   this.status(); setTimeout(()=>{ const i=document.getElementById('devCode'); if(i)i.focus(); },50);
 },
 closePanel(){ this.isOpen=false;
   const bg=document.getElementById('devBg'),p=document.getElementById('devPanel');
   if(bg)bg.classList.remove('open'); if(p)p.classList.remove('open'); },
};
/* إزالة العوائق التي نظّفها الحارس في جلسة سابقة */
function pruneClearedDecor(){
  if(!G.clearedDecor||!G.clearedDecor.length)return;
  const set=new Set(G.clearedDecor);
  World.decor=World.decor.filter(d=>{
    const k=Math.floor(d.x/TILE)+','+Math.floor(d.y/TILE);
    if(!set.has(k))return true;
    const tx=Math.floor(d.x/TILE),ty=Math.floor(d.y/TILE);
    if(tx>=0&&ty>=0&&tx<MAP_W&&ty<MAP_H)World.solid[ty*MAP_W+tx]=0;
    return false; });
}
World.gen(); World.bakeGround(); initAtmo();
['mossnip','zibbit','puddlefin','frostle'].forEach((sp,i)=>{ const pt=World.spawnPts.meadow[i];
  G.wildPips.push({sp,x:pt[0]*TILE,y:pt[1]*TILE,tx:pt[0]*TILE,ty:pt[1]*TILE,area:'meadow',t:rand(0,9),wt:0,flip:false}); });
Input.init();
DevSys.init();
$('saveFile').addEventListener('change',e=>{
  const f=e.target.files&&e.target.files[0]; e.target.value=''; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ const d=SaveSys.parseFile(String(r.result));
    if(!d){ toast('هذا الملف ليس حفظ بيبغروف.','warn'); AudioSys.deny(); return; }
    applySave(d); logEvent('حُمّل البستان من ملف حفظ.');
    if(!G.started){ $('title').classList.add('hide'); startGame(false); }
    UI.hud(); UI.objective(); toast('حُمّل ملف الحفظ — أهلًا بعودتك!','good'); };
  r.onerror=()=>toast('تعذّرت قراءة الملف.','warn');
  r.readAsText(f);
});
const saved=SaveSys.load();
if(saved)applySave(saved); else freshState();
pruneClearedDecor();
rebuildNpcs();
AudioSys.setVol(G.settings.vol); AudioSys.setMute(G.settings.muted);
showTitle(); UI.hud(); UI.logBadge(); G.dayT=1.25;
addEventListener('beforeunload',()=>{ if(G.started)SaveSys.store(G); });
document.addEventListener('visibilitychange',()=>{ if(document.hidden&&G.started)SaveSys.store(G); });
/* PWA: تسجيل عامل الخدمة عند الاستضافة (مثل GitHub Pages) */
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
}
requestAnimationFrame(loop);
</script>
